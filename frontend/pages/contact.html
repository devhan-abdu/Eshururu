  <!-- Header -->

   <section class="contact-hero">
    <div class="container">
      <h1>Contact Us</h1>
      <p>Home > Contact</p>
    </div>
   </section>
   <section class="contact-info">
     <div class="phone">
       <i class="fa-solid fa-phone"></i>
       <h2>Phone</h2>
       <p class="contact-content" style="font-size: 16px;">+251 912 345 678</p>
     </div>
     <div class="email">
       <i class="fa-solid fa-envelope"></i>
       <h2>Email Address</h2>
       <p class="contact-content" style="font-size: 16px;">support@cuddlecare.com</p>
     </div>
     <div class="address">
       <i class="fa-solid fa-location-dot"></i>

  <section class="get-in-touch" id="get-in-touch">
            <h2>Get in Touch</h2>
            <p>Lorem ipsum. Quibusdam distinctio fuga suscipit in inventore vitae , officia quis earum praesentium enim!</p>
            <div class="contact-wrapper">
            
                <!-- Contact Form -->
                <div class="contact-form">
                    <form action="send-email.php" method="post">
                    <input type="text" id="name" name="name" placeholder="Name" required><br>
                    <input type="email" id="email" name="email" placeholder="Email"  required><br>
                    <input type="text" id="subject" name="subject" placeholder="Subject" required><br>
                    <textarea id="message" name="message" placeholder="Message" required></textarea><br>
                    <button type="submit">Send Message</button>
                    <div class="social-icons">
                      <i class="fa-brands fa-square-x-twitter"></i>
                      <i class="fa-brands fa-linkedin"></i>
                      <i class="fa-brands fa-square-instagram"></i>
                    </div>
                    </form>
                </div>
